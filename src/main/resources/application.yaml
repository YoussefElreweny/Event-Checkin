spring:
  application:
    name: even-checkin
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:event_checkin}
    username: ${POSTGRES_USER:eventuser}
    password: ${POSTGRES_PASSWORD:eventpass}
  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: true
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    org.hibernate.SQL: DEBUG
    
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000